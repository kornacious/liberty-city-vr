; Liberty City VR radio-board placements, schema 1.
; Axes are vehicle-local, relative to the driver's authored front-seat point.
; Whole-placement precedence: personal model, personal global, bundled model,
; bundled global. Angles are canonical integer degrees [-180,179].
; Add reviewed [Vehicle.<model id>] sections from radio_board_export.ini here.
[RadioBoard]
Version=1

[Global]
Enabled=1
Xmm=350
Ymm=600
Zmm=300
PitchDeg=0
YawDeg=0
RollDeg=0
ScalePercent=100
